<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Faculty Profile')}"></head>
<body><nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div class="d-flex"><div th:replace="~{fragments/layout :: sidebar-faculty}"></div>
        <div class="main-content">
            <h2 class="mb-4"><i class="fas fa-user me-2"></i>Faculty Profile</h2>
            <div class="card p-4" style="background:#16213e;border:1px solid rgba(102,126,234,0.2);border-radius:15px;">
                <div class="row"><div class="col-md-4 text-center">
                    <div class="rounded-circle mx-auto d-flex align-items-center justify-content-center" style="width:150px;height:150px;background:linear-gradient(135deg,#f093fb,#f5576c);font-size:3rem;">
                        <span th:text="${#strings.substring(faculty.user.fullName,0,1)}" class="text-white"></span></div>
                    <h4 class="mt-3" th:text="${faculty.user.fullName}"></h4><span class="badge bg-info">Faculty</span>
                </div><div class="col-md-8">
                    <table class="table table-dark table-borderless">
                        <tr><td class="text-muted">Email</td><td th:text="${faculty.user.email}"></td></tr>
                        <tr><td class="text-muted">Employee ID</td><td th:text="${faculty.employeeId}"></td></tr>
                        <tr><td class="text-muted">Department</td><td th:text="${faculty.department}"></td></tr>
                        <tr><td class="text-muted">Designation</td><td th:text="${faculty.designation}"></td></tr>
                        <tr><td class="text-muted">Specialization</td><td th:text="${faculty.specialization}"></td></tr>
                    </table></div></div></div></div></div>
</body></html>
