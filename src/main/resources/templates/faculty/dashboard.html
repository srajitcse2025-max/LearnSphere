<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Faculty Dashboard')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div class="d-flex">
        <div th:replace="~{fragments/layout :: sidebar-faculty}"></div>
        <div class="main-content">
            <h2 class="mb-4"><i class="fas fa-chalkboard-teacher me-2"></i>Welcome, <span th:text="${user.fullName}"></span>!</h2>
            <div class="row">
                <div class="col-md-4 mb-4">
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-id-badge"></i></div><h6>Employee ID</h6><h3 th:text="${faculty.employeeId}"></h3></div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="stat-card"><div class="stat-icon" style="background:linear-gradient(135deg,#f093fb,#f5576c);"><i class="fas fa-building"></i></div><h6>Department</h6><h3 th:text="${faculty.department}"></h3></div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="stat-card"><div class="stat-icon" style="background:linear-gradient(135deg,#43e97b,#38f9d7);"><i class="fas fa-award"></i></div><h6>Designation</h6><h3 th:text="${faculty.designation}"></h3></div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <a th:href="@{/faculty/courses}" class="text-decoration-none">
                        <div class="card p-4 text-center" style="background:#16213e;border:1px solid rgba(102,126,234,0.2);border-radius:15px;">
                            <i class="fas fa-book fa-2x mb-2" style="color:#667eea;"></i><h5 class="text-white">Manage Courses</h5>
                        </div>
                    </a>
                </div>
                <div class="col-md-4 mb-3">
                    <a th:href="@{/faculty/marks}" class="text-decoration-none">
                        <div class="card p-4 text-center" style="background:#16213e;border:1px solid rgba(102,126,234,0.2);border-radius:15px;">
                            <i class="fas fa-edit fa-2x mb-2" style="color:#f093fb;"></i><h5 class="text-white">Enter Marks</h5>
                        </div>
                    </a>
                </div>
                <div class="col-md-4 mb-3">
                    <a th:href="@{/faculty/profile}" class="text-decoration-none">
                        <div class="card p-4 text-center" style="background:#16213e;border:1px solid rgba(102,126,234,0.2);border-radius:15px;">
                            <i class="fas fa-user fa-2x mb-2" style="color:#43e97b;"></i><h5 class="text-white">My Profile</h5>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
