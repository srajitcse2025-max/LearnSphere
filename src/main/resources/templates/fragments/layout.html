<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark" style="background:#0f3460;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/dashboard}"><i class="fas fa-graduation-cap me-2"></i>LearnSphere</a>
            <div class="d-flex align-items-center">
                <span class="text-light me-3" sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div th:fragment="sidebar-student" class="sidebar">
        <a th:href="@{/dashboard}" class="sidebar-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a th:href="@{/student/profile}" class="sidebar-link"><i class="fas fa-user"></i> Profile</a>
        <a th:href="@{/student/courses}" class="sidebar-link"><i class="fas fa-book"></i> Courses</a>
        <a th:href="@{/student/quizzes}" class="sidebar-link"><i class="fas fa-question-circle"></i> Quizzes</a>
        <a th:href="@{/student/academics}" class="sidebar-link"><i class="fas fa-chart-bar"></i> Academics</a>
        <a th:href="@{/student/performance}" class="sidebar-link"><i class="fas fa-trophy"></i> Performance</a>
    </div>

    <div th:fragment="sidebar-faculty" class="sidebar">
        <a th:href="@{/dashboard}" class="sidebar-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a th:href="@{/faculty/profile}" class="sidebar-link"><i class="fas fa-user"></i> Profile</a>
        <a th:href="@{/faculty/courses}" class="sidebar-link"><i class="fas fa-book"></i> My Courses</a>
        <a th:href="@{/faculty/marks}" class="sidebar-link"><i class="fas fa-edit"></i> Enter Marks</a>
    </div>
</body>
</html>
