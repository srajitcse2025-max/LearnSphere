<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - LearnSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 0; }
        .register-card { background: rgba(22, 33, 62, 0.95); border: 1px solid rgba(102,126,234,0.3); border-radius: 20px; padding: 2.5rem; width: 500px; backdrop-filter: blur(10px); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .register-card h2 { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .form-control, .form-select { background: #1a1a2e; border: 1px solid rgba(102,126,234,0.3); color: white; border-radius: 10px; padding: 10px; }
        .form-control::placeholder { color: #8888a8; opacity: 1; }
        .form-control:focus, .form-select:focus { background: #1a1a2e; color: white; border-color: #667eea; box-shadow: 0 0 10px rgba(102,126,234,0.3); }
        .form-select option { background: #1a1a2e; color: white; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 10px; padding: 12px; font-weight: 600; }
        a { color: #667eea; }
        label { color: #a0a0b0; font-size: 0.9rem; }
        .text-muted { color: #9595b0 !important; }
        p { color: #b0b0c0; }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="text-center mb-4">
            <i class="fas fa-graduation-cap fa-3x" style="color:#667eea;"></i>
            <h2 class="mt-2 fw-bold">Create Account</h2>
        </div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <form th:action="@{/register}" method="post">
            <div class="row">
                <div class="col-12 mb-3"><label>Full Name</label><input type="text" name="fullName" class="form-control" required></div>
                <div class="col-12 mb-3"><label>Email</label><input type="email" name="email" class="form-control" required></div>
                <div class="col-12 mb-3"><label>Password</label><input type="password" name="password" class="form-control" required></div>
                <div class="col-12 mb-3">
                    <label>Role</label>
                    <select name="role" class="form-select" id="roleSelect" onchange="toggleFields()">
                        <option value="ROLE_STUDENT">Student</option>
                        <option value="ROLE_FACULTY">Faculty</option>
                    </select>
                </div>
            </div>
            <div id="studentFields">
                <div class="row">
                    <div class="col-6 mb-3"><label>Register Number</label><input type="text" name="registerNumber" class="form-control"></div>
                    <div class="col-6 mb-3"><label>Department</label><input type="text" name="department" class="form-control" value="CSE"></div>
                    <div class="col-6 mb-3"><label>Section</label><input type="text" name="section" class="form-control" value="A"></div>
                    <div class="col-6 mb-3"><label>College</label><input type="text" name="college" class="form-control"></div>
                </div>
            </div>
            <div id="facultyFields" style="display:none;">
                <div class="row">
                    <div class="col-6 mb-3"><label>Employee ID</label><input type="text" name="employeeId" class="form-control"></div>
                    <div class="col-6 mb-3"><label>Department</label><input type="text" name="department" class="form-control"></div>
                    <div class="col-12 mb-3"><label>Designation</label><input type="text" name="designation" class="form-control"></div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Register</button>
            <p class="text-center text-muted">Already have an account? <a th:href="@{/login}">Login</a></p>
        </form>
    </div>
    <script>
        function toggleFields() {
            var role = document.getElementById('roleSelect').value;
            document.getElementById('studentFields').style.display = role === 'ROLE_STUDENT' ? 'block' : 'none';
            document.getElementById('facultyFields').style.display = role === 'ROLE_FACULTY' ? 'block' : 'none';
        }
    </script>
</body>
</html>
