<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quiz Result')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div class="d-flex">
        <div th:replace="~{fragments/layout :: sidebar-student}"></div>
        <div class="main-content">
            <h2 class="mb-4"><i class="fas fa-poll me-2"></i>Quiz Results</h2>
            <div class="card p-4 mb-4 text-center" style="background:#16213e;border:1px solid rgba(102,126,234,0.2);border-radius:15px;">
                <h3 th:text="${attempt.quiz.title}"></h3>
                <div class="my-3">
                    <span class="display-3 fw-bold" th:classappend="${attempt.percentage >= 60 ? 'text-success' : 'text-danger'}"
                          th:text="${#numbers.formatDecimal(attempt.percentage,1,1) + '%'}"></span>
                </div>
                <h5>Score: <span th:text="${attempt.score}"></span> / <span th:text="${attempt.totalQuestions}"></span></h5>
                <div class="mt-3">
                    <span th:if="${attempt.percentage >= 80}" class="badge bg-success fs-6">Excellent!</span>
                    <span th:if="${attempt.percentage >= 60 and attempt.percentage < 80}" class="badge bg-info fs-6">Good Job!</span>
                    <span th:if="${attempt.percentage < 60}" class="badge bg-warning fs-6">Needs Improvement</span>
                </div>
            </div>
            <h4 class="mb-3">Detailed Review</h4>
            <div th:each="sa,iter : ${answers}" class="card p-4 mb-3" th:style="'background:#16213e;border:2px solid ' + (${sa.correct} ? '#28a745' : '#dc3545') + ';border-radius:15px;'">
                <h5><span th:text="'Q' + ${iter.count} + '. '"></span><span th:text="${sa.question.questionText}"></span></h5>
                <p>Your answer: <span class="fw-bold" th:text="${sa.selectedAnswer}"></span>
                    <i th:if="${sa.correct}" class="fas fa-check-circle text-success ms-2"></i>
                    <i th:if="${!sa.correct}" class="fas fa-times-circle text-danger ms-2"></i>
                </p>
                <p th:if="${!sa.correct}">Correct answer: <span class="fw-bold text-success" th:text="${sa.question.correctAnswer}"></span></p>
                <p class="text-info small"><i class="fas fa-lightbulb me-1"></i><span th:text="${sa.question.explanation}"></span></p>
            </div>
            <a th:href="@{/student/quizzes}" class="btn btn-outline-primary"><i class="fas fa-arrow-left me-1"></i>Back to Quizzes</a>
        </div>
    </div>
</body>
</html>
