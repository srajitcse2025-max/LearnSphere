<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div class="d-flex">
        <div th:replace="~{fragments/layout :: sidebar-student}"></div>
        <div class="main-content">
            <h2 class="mb-4"><i class="fas fa-user me-2"></i>My Profile</h2>
            <div class="card p-4" style="background:#16213e;border:1px solid rgba(102,126,234,0.2);border-radius:15px;">
                <div class="row">
                    <div class="col-md-4 text-center">
                        <div class="rounded-circle mx-auto d-flex align-items-center justify-content-center" style="width:150px;height:150px;background:linear-gradient(135deg,#667eea,#764ba2);font-size:3rem;">
                            <span th:text="${#strings.substring(student.user.fullName,0,1)}" class="text-white"></span>
                        </div>
                        <h4 class="mt-3" th:text="${student.user.fullName}"></h4>
                        <span class="badge bg-primary" th:text="'Student'"></span>
                    </div>
                    <div class="col-md-8">
                        <table class="table table-dark table-borderless">
                            <tr><td class="text-muted">Email</td><td th:text="${student.user.email}"></td></tr>
                            <tr><td class="text-muted">Register Number</td><td th:text="${student.registerNumber}"></td></tr>
                            <tr><td class="text-muted">Department</td><td th:text="${student.department}"></td></tr>
                            <tr><td class="text-muted">Section</td><td th:text="${student.section}"></td></tr>
                            <tr><td class="text-muted">College</td><td th:text="${student.college}"></td></tr>
                            <tr><td class="text-muted">Semester</td><td th:text="${student.semester}"></td></tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
