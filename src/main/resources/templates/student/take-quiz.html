<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Take Quiz')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div class="d-flex">
        <div th:replace="~{fragments/layout :: sidebar-student}"></div>
        <div class="main-content">
            <h2 class="mb-2"><i class="fas fa-edit me-2"></i><span th:text="${quiz.title}"></span></h2>
            <p class="text-muted mb-4">Topic: <span th:text="${quiz.topic}"></span> | Duration: <span th:text="${quiz.durationMinutes}"></span> min</p>
            <form th:action="@{'/student/quizzes/' + ${quiz.id} + '/submit'}" method="post">
                <div th:each="q,iter : ${questions}" class="card p-4 mb-3" style="background:#16213e;border:1px solid rgba(102,126,234,0.2);border-radius:15px;">
                    <h5><span th:text="'Q' + ${iter.count} + '. '"></span><span th:text="${q.questionText}"></span></h5>
                    <div class="mt-3">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" th:name="'answer_' + ${q.id}" value="A" required>
                            <label class="form-check-label" th:text="'A. ' + ${q.optionA}"></label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" th:name="'answer_' + ${q.id}" value="B">
                            <label class="form-check-label" th:text="'B. ' + ${q.optionB}"></label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" th:name="'answer_' + ${q.id}" value="C">
                            <label class="form-check-label" th:text="'C. ' + ${q.optionC}"></label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" th:name="'answer_' + ${q.id}" value="D">
                            <label class="form-check-label" th:text="'D. ' + ${q.optionD}"></label>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-paper-plane me-2"></i>Submit Quiz</button>
            </form>
        </div>
    </div>
</body>
</html>
