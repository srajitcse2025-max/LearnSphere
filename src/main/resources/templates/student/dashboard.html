<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Student Dashboard')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div class="d-flex">
        <div th:replace="~{fragments/layout :: sidebar-student}"></div>
        <div class="main-content">
            <h2 class="mb-4"><i class="fas fa-tachometer-alt me-2"></i>Welcome, <span th:text="${user.fullName}"></span>!</h2>
            <div class="row">
                <div class="col-md-3 mb-4">
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-id-card"></i></div>
                        <h6>Register No.</h6><h3 th:text="${student.registerNumber}"></h3></div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="stat-card"><div class="stat-icon" style="background:linear-gradient(135deg,#f093fb,#f5576c);"><i class="fas fa-building"></i></div>
                        <h6>Department</h6><h3 th:text="${student.department}"></h3></div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="stat-card"><div class="stat-icon" style="background:linear-gradient(135deg,#4facfe,#00f2fe);"><i class="fas fa-users"></i></div>
                        <h6>Section</h6><h3 th:text="${student.section}"></h3></div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="stat-card"><div class="stat-icon" style="background:linear-gradient(135deg,#43e97b,#38f9d7);"><i class="fas fa-calendar"></i></div>
                        <h6>Semester</h6><h3 th:text="${student.semester}"></h3></div>
                </div>
            </div>
            <div class="card p-4 mb-4" style="background:#16213e;border:1px solid rgba(102,126,234,0.2);border-radius:15px;">
                <h5><i class="fas fa-university me-2"></i>College: <span th:text="${student.college}" class="text-info"></span></h5>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <a th:href="@{/student/courses}" class="text-decoration-none">
                        <div class="card p-4 text-center" style="background:#16213e;border:1px solid rgba(102,126,234,0.2);border-radius:15px;cursor:pointer;">
                            <i class="fas fa-book fa-2x mb-2" style="color:#667eea;"></i><h5 class="text-white">My Courses</h5>
                        </div>
                    </a>
                </div>
                <div class="col-md-4 mb-3">
                    <a th:href="@{/student/quizzes}" class="text-decoration-none">
                        <div class="card p-4 text-center" style="background:#16213e;border:1px solid rgba(102,126,234,0.2);border-radius:15px;cursor:pointer;">
                            <i class="fas fa-question-circle fa-2x mb-2" style="color:#f093fb;"></i><h5 class="text-white">Take Quiz</h5>
                        </div>
                    </a>
                </div>
                <div class="col-md-4 mb-3">
                    <a th:href="@{/student/academics}" class="text-decoration-none">
                        <div class="card p-4 text-center" style="background:#16213e;border:1px solid rgba(102,126,234,0.2);border-radius:15px;cursor:pointer;">
                            <i class="fas fa-chart-bar fa-2x mb-2" style="color:#43e97b;"></i><h5 class="text-white">Academic Results</h5>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
